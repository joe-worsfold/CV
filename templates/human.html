<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <style>{{CSS}}</style>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <h1>{{NAME}}</h1>
          <p class="headline">{{HEADLINE}}</p>
          {{CONTACT}}
        </div>
      </header>

      <p class="summary">{{SUMMARY}}</p>

      <div class="grid">
        <aside class="sidebar">
          <section>
            <h2>Skills</h2>
            {{SKILLS}}
          </section>
          <section>
            <h2>Profile</h2>
            {{META}}
          </section>
        </aside>

        <main>
          <section>
            <h2>Experience</h2>
            {{ROLES}}
          </section>
          {{PROJECTS}}
          <section class="education">
            <h2>Education</h2>
            {{EDUCATION}}
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
