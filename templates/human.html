<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <style>{{CSS}}</style>
  </head>
  <body>
    <div class="sheet">
      <header class="masthead">
        {{PHOTO}}
        <h1>{{NAME}}</h1>
        <p class="headline">{{HEADLINE}}</p>
        {{CONTACT}}
        <p class="summary">{{SUMMARY}}</p>
      </header>

      <div class="layout">
        <aside>
          <h2>Skills</h2>
          {{SKILLS}}
          {{META}}
        </aside>
        <main>
          <h2>Experience</h2>
          {{ROLES}}
          {{PROJECTS}}
          <section class="education">
            <h2>Education</h2>
            {{EDUCATION}}
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
